<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sem conexão</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #080b12; color: #e9edf5;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 16px;
  }
  img { width: 72px; height: 72px; opacity: 0.9; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; }
  p { color: #94a3b8; font-size: 14px; max-width: 320px; margin: 0; line-height: 1.5; }
  button {
    margin-top: 8px; background: #3b82f6; color: #fff; border: 0;
    border-radius: 12px; padding: 12px 20px; font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="Zênite" />
  <h1>Você está sem conexão</h1>
  <p>Não foi possível carregar o Zênite agora. Verifique sua internet e tente de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</body>
</html>
