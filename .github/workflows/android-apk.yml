name: Build Android APK

# Gera o APK do app Android (Capacitor) na nuvem, sem precisar de Android Studio local.
# Disparo manual: aba "Actions" do GitHub -> "Build Android APK" -> "Run workflow".
# Ao terminar, baixe o APK em "Artifacts" (zenite-android-apk) e instale no celular (sideload).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gerar projeto Android (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Build do APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenite-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
